<!--HEAD-->
<title>Hello Deck</title>
<style>
/* One full-window picture. The only chrome is what the presenter asks for. */
:root{--panel:rgba(16,18,24,.92);--text:#f2f4f8;--dim:#a4abb8;--sel:#ff5a1f;color-scheme:dark}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#000;color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none;background:#000}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
body.idle{cursor:none}
.notes{position:absolute;left:0;right:0;bottom:0;padding:18px max(24px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));background:var(--panel);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 32px;align-items:start}
.notes p{margin:0;max-width:70ch;font-size:18px;white-space:pre-line}
.notes .meta{color:var(--dim);font-variant-numeric:tabular-nums;text-align:right;white-space:pre}
.over{position:absolute;inset:0;background:rgba(12,13,17,.96);overflow:auto;padding:40px max(40px,env(safe-area-inset-right,0px)) 40px max(40px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:22px;align-content:start}
.over button{all:unset;cursor:pointer;display:grid;gap:8px}
.over .th{aspect-ratio:16/9;background:#222 center/cover;outline:2px solid transparent;outline-offset:3px}
.over button:hover .th,.over button:focus-visible .th,.over button[aria-current=true] .th{outline-color:var(--sel)}
.over span{color:var(--dim);font-size:14px}
.help{position:absolute;right:24px;top:24px;background:var(--panel);padding:18px 22px;display:grid;grid-template-columns:auto auto;gap:4px 20px;max-width:calc(100vw - 48px)}
.help b{font-weight:500}.help span{color:var(--dim)}
.toast{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:var(--panel);padding:8px 16px;font-size:14px;transition:opacity .4s}
.load{position:absolute;inset:0;background:#000;color:#9aa3b5;display:grid;place-content:center;gap:14px;font-size:16px}
.load p{margin:0;text-align:center}
.load div{width:min(320px,70vw);height:3px;background:#22252e}
.load i{display:block;height:100%;width:0;background:var(--sel)}
.load .err{max-width:44ch;text-align:center;color:#f2f4f8;line-height:1.5}
/* visible controls: never hover-only, quiet until used */
.ctrl{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:2px;opacity:.55;transition:opacity .3s}
.ctrl:hover,.ctrl:focus-within{opacity:1}
body.idle .ctrl{opacity:0}
.cb{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--text)}
.cb:hover{background:rgba(255,255,255,.1)}
.cb:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.cb svg{width:22px;height:22px}
.cb .on{display:none}.cb[aria-pressed=true] .on{display:inline}.cb[aria-pressed=true] .off{display:none}
.ctrl .prog{position:absolute;left:8px;right:8px;bottom:-2px;height:2px;background:var(--sel);transform-origin:0 50%;transform:scaleX(0);transition:opacity .4s}
.hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);color:var(--dim);font-size:14px;opacity:0;transition:opacity 1.2s;pointer-events:none;white-space:nowrap}
.hint.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
@media (max-width:520px){.hint{white-space:normal;text-align:center;width:calc(100% - 32px)}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
</style>
<!--BODY-->
<canvas id="stage" tabindex="0" aria-label="The presentation"></canvas>
<div id="ui"></div>
<script>/*__ASSETS__*/</script>
<script>/*__BUNDLE__*/</script>
<!--END-->
